<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 428" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dubbing-dark-title dubbing-dark-desc">
<title id="dubbing-dark-title">How dubbing works</title>
<desc id="dubbing-dark-desc">The dubbing pipeline: ffmpeg extracts the audio, faster-whisper transcribes it, sherpa-onnx optionally labels the speakers, M2M100 translates each line, Chatterbox speaks every line in the cloned original voice or a saved one, each clip is fitted to its original timing, and ffmpeg puts the new track back on the video with matching subtitles.</desc>
<defs><marker id="dubbing-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b4c2"/></marker><marker id="dubbing-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ffa800"/></marker><marker id="dubbing-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa7e0"/></marker></defs>
<rect width="100%" height="100%" fill="#0f141c"/>
