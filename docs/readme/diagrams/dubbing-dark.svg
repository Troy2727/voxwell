<g><rect x="684" y="32" width="144" height="80" rx="6" fill="#0f141c"/><rect x="684" y="32" width="144" height="80" rx="6" fill="#182433" stroke="rgba(245,241,236,0.55)" stroke-width="1"/><text x="756.0" y="67" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Translate</text><text x="756.0" y="85" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">M2M100 418M</text></g>
<g><rect x="684" y="192" width="144" height="80" rx="6" fill="#0f141c"/><rect x="684" y="192" width="144" height="80" rx="6" fill="rgba(255,168,0,0.1)" stroke="#ffa800" stroke-width="1.4"/><text x="756.0" y="217" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Speak lines</text><text x="756.0" y="235" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">Chatterbox</text><text x="756.0" y="255" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">cloned voice</text></g>
<g><rect x="516" y="192" width="144" height="80" rx="6" fill="#0f141c"/><rect x="516" y="192" width="144" height="80" rx="6" fill="#182433" stroke="rgba(245,241,236,0.55)" stroke-width="1"/><text x="588.0" y="227" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Fit timing</text><text x="588.0" y="245" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">tempo · trim</text></g>
<g><rect x="348" y="192" width="144" height="80" rx="6" fill="#0f141c"/><rect x="348" y="192" width="144" height="80" rx="6" fill="#182433" stroke="rgba(245,241,236,0.55)" stroke-width="1"/><text x="420.0" y="227" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Assemble</text><text x="420.0" y="245" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">ffmpeg mux</text></g>
<g><rect x="180" y="192" width="144" height="80" rx="24" fill="#0f141c"/><rect x="180" y="192" width="144" height="80" rx="24" fill="rgba(245,241,236,0.05)" stroke="rgba(245,241,236,0.45)" stroke-width="1"/><text x="252.0" y="227" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Dubbed video</text><text x="252.0" y="245" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">.mp4 + .srt</text></g>
<g><line x1="756" y1="280" x2="756" y2="304" stroke="#ffa800" stroke-width="1" stroke-dasharray="2,3"/><text x="828" y="324" fill="#f5f1ec" font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif" text-anchor="end">each speaker&#x27;s own voice, cloned —</text><text x="828" y="346" fill="#f5f1ec" font-size="16" font-style="italic" font-family="Georgia, 'Times New Roman', serif" text-anchor="end">or any voice you saved</text></g>
