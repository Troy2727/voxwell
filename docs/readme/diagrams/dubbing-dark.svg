<g><rect x="348" y="32" width="144" height="80" rx="6" fill="#0f141c"/><rect x="348" y="32" width="144" height="80" rx="6" fill="#182433" stroke="rgba(245,241,236,0.55)" stroke-width="1"/><text x="420.0" y="67" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Transcribe</text><text x="420.0" y="85" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">faster-whisper</text></g>
