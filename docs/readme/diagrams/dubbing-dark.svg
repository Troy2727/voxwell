<g><path d="M 516 232 H 492" fill="none" stroke="#a9b4c2" stroke-width="1.4" marker-end="url(#dubbing-arrow)"/></g>
<g><path d="M 348 232 H 324" fill="none" stroke="#a9b4c2" stroke-width="1.4" marker-end="url(#dubbing-arrow)"/></g>
<g><rect x="12" y="32" width="144" height="80" rx="24" fill="#0f141c"/><rect x="12" y="32" width="144" height="80" rx="24" fill="rgba(245,241,236,0.05)" stroke="rgba(245,241,236,0.45)" stroke-width="1"/><text x="84.0" y="67" fill="#f5f1ec" font-size="16" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Your video</text><text x="84.0" y="85" fill="#a9b4c2" font-size="12" font-weight="400" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">any ffmpeg format</text></g>
