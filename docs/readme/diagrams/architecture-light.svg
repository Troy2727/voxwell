<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 712" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-light-title architecture-light-desc">
<title id="architecture-light-title">Voxwell architecture</title>
<desc id="architecture-light-desc">Everything runs on your machine: the desktop and web app, the voxwell command line (with its MCP server and agent skill) and any OpenAI SDK all call one local Voxwell server on 127.0.0.1:8765, which runs local speech, listening and language models and keeps voices and projects in a local data folder. Only model weights come from Hugging Face, once, on first use.</desc>
