name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Default behaviour must match on every platform (see CONTRIBUTING.md).
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2 (no moving major tag)
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Real-ffmpeg tests run on Linux; elsewhere they are skipped, not faked.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    name: Frontend end-to-end (mock backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The real-backend run (npm run e2e:real) needs the models, so it runs locally before a release.
      - run: npm run e2e

  desktop:
    name: Desktop overlay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is left out: the test puts a fake `uv` script on PATH, and spawning without a shell
        # there only finds .exe files.
        os: [macos-latest, macos-15-intel, ubuntu-latest]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run on macOS
        if: runner.os == 'macOS'
        run: node e2e-electron/overlay-smoke.cjs
      - name: Run on Linux, under a window manager and a compositor
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick openbox picom libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libgtk-3-0t64 libgbm1 libasound2t64
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & picom --backend xrender & sleep 2; node e2e-electron/overlay-smoke.cjs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: desktop-overlay-${{ matrix.os }}
          path: app/overlay-smoke
