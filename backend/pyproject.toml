[project]
name = "voxwell"
version = "0.1.0"
description = "Voxwell backend"
license = "MIT"
requires-python = ">=3.11,<3.12"  # chatterbox-tts 0.1.6 pins numpy<1.26 (no 3.12 wheels)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",  # uvicorn serves WebSockets (live audio) only with this installed
    "python-multipart>=0.0.9",
    "platformdirs>=4",
    "truststore>=0.10",  # trust the OS certificate store (corporate proxies, antivirus TLS inspection)
    # Models (imported lazily by each feature).
    "chatterbox-tts==0.1.6",
    "parler-tts @ git+https://github.com/huggingface/parler-tts.git",
    "faster-whisper>=1.0",
    "transformers==4.46.3",
    "torch",
    "torchaudio",  # listed directly so the CUDA index source below applies to it
    "sentencepiece",
    "soundfile",
    "diffusers==0.36.0",  # Stable Audio (sound effects); newest release chatterbox-tts still imports against
    "torchsde>=0.2.6",
    "scipy",
]

[tool.uv]
# parler-tts pins transformers==4.46.1; chatterbox-tts 0.1.6 needs 4.46.3 (patch-level bump).
override-dependencies = [
    "transformers==4.46.3",
    # chatterbox-tts 0.1.6 pins diffusers==0.29.0, which has no StableAudioPipeline (added in 0.30). 0.36.0 is the
    # newest release where every diffusers name chatterbox imports still exists (tests/test_model_api_contracts.py).
    "diffusers==0.36.0",
    # pykakasi is GPL-3.0 (chatterbox-tts uses it only for Japanese); never install it.
    "pykakasi; sys_platform == 'never'",
]
# onnx>=1.18 imports ml_dtypes features that need numpy>=1.26, which chatterbox-tts forbids.
constraint-dependencies = [
    "onnx<1.18",
    # resemble-perth (chatterbox's audio watermarker) imports pkg_resources, removed in setuptools 81.
    "setuptools<81",
]

# CUDA builds on Windows/Linux (they fall back to CPU without an NVIDIA GPU); macOS uses the
# default PyPI build, which supports Apple MPS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
voxwell = "voxwell.cli:main"  # no arguments: start the server (what the desktop app runs)
voxwell-mcp = "voxwell.features.integrations.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voxwell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
